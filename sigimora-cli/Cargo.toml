[package]
name = "sigimora-cli"
version = "0.1.0"
description = "SIGIMORA CLI — admin tool for the threshold signing backend"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/AliIbrahimMohammed/sigimora-api"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", features = ["json", "blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
hex = "0.4"
tokio = { version = "1", features = ["full"] }
chrono = "0.4"
