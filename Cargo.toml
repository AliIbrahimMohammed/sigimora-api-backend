[workspace]
members = [
    "sigimora-math",
    "sigimora-crypto",
    "sigimora-ats",
    "sigimora-refresh",
    "sigimora-mcp",
    "sigimora-server",
    "sigimora-cli",
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.3.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/AliIbrahimMohammed/sigimora-api"

[workspace.dependencies]
# Curve arithmetic (BLS12-381)
blstrs = "0.7"
blst = "0.3"
ff = "0.13"
group = "0.13"
pairing = "0.23"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Security
zeroize = { version = "1", features = ["derive"] }
subtle = "2"
aes-gcm = "0.10"
sha2 = "0.10"
sha3 = "0.10"

# Randomness
rand = "0.8"
rand_core = "0.6"

# Key derivation
hkdf = "0.12"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Error handling
thiserror = "1"
anyhow = "1"

# Misc
hex = "0.4"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
